<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Signaturen</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="../shared/signatures.js"></script>
    <style>
      :root{--brand:#2f9e5f;--deep:#1f7a47;--ink:#1b2420;--mut:#5d6b64;--line:#e3e9e5;--bg:#f6f8f6;--card:#fff}
      *{box-sizing:border-box}
      body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
      .hd{padding:14px 16px 10px}
      .hd h1{margin:0;font-size:15px;font-weight:700}
      .hd p{margin:4px 0 0;color:var(--mut);font-size:12px;line-height:1.4}
      .list{padding:6px 12px 16px;display:flex;flex-direction:column;gap:10px}
      .sig{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
      .sig h2{margin:0 0 1px;font-size:13px;font-weight:700}
      .sig .desc{color:var(--mut);font-size:11px;margin-bottom:9px}
      .preview{border:1px dashed var(--line);border-radius:8px;padding:10px;background:#fff;overflow:auto}
      .apply{margin-top:10px;width:100%;border:none;background:var(--brand);color:#fff;font:inherit;font-weight:600;
             padding:8px 12px;border-radius:7px;cursor:pointer}
      .apply:hover{background:var(--deep)}
      .status{min-height:18px;padding:0 16px 14px;color:var(--deep);font-size:12px;font-weight:600}
    </style>
  </head>
  <body>
    <div class="hd">
      <h1>Firmensignatur wählen</h1>
      <p>Wähle eine Vorlage — sie ersetzt die Signatur in dieser Nachricht. Daten kommen aus deinem Profil.</p>
    </div>
    <div class="list" id="list"></div>
    <div class="status" id="status"></div>

    <script>
      (function () {
        function setStatus(t) { document.getElementById("status").textContent = t || ""; }

        Office.onReady(function (info) {
          if (info.host !== Office.HostType.Outlook) return;
          var profile = Office.context.mailbox.userProfile;
          var list = document.getElementById("list");

          window.SignatureLib.list.forEach(function (sig) {
            var card = document.createElement("div");
            card.className = "sig";

            var h = document.createElement("h2"); h.textContent = sig.label; card.appendChild(h);
            var d = document.createElement("div"); d.className = "desc"; d.textContent = sig.desc; card.appendChild(d);

            var prev = document.createElement("div");
            prev.className = "preview";
            prev.innerHTML = window.SignatureLib.build(sig.id, profile);
            card.appendChild(prev);

            var btn = document.createElement("button");
            btn.className = "apply"; btn.textContent = "Diese Signatur einfügen";
            btn.addEventListener("click", function () {
              setStatus("Wird eingefügt…");
              Office.context.mailbox.item.body.setSignatureAsync(
                window.SignatureLib.build(sig.id, profile),
                { coercionType: Office.CoercionType.Html },
                function (res) {
                  setStatus(res.status === Office.AsyncResultStatus.Succeeded
                    ? "„" + sig.label + "“ eingefügt ✓"
                    : "Fehler beim Einfügen");
                }
              );
            });
            card.appendChild(btn);
            list.appendChild(card);
          });
        });
      })();
    </script>
  </body>
</html>
